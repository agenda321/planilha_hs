<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Planilha de Horas | Registro de Voo</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1a237e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 30%,#b87c4f,#6e4a2e);font-family:'Segoe UI',Georgia,serif;padding:8px;display:flex;justify-content:center;align-items:flex-start}
.skeuo-container{max-width:1400px;width:100%;background:#e2d6c0;background-image:repeating-linear-gradient(45deg,#dacaa8 0px,#dacaa8 2px,#efe3c9 2px,#efe3c9 8px);border-radius:32px;box-shadow:0 25px 45px rgba(0,0,0,.5),inset 0 1px 4px rgba(255,255,200,.8);padding:10px}
.planilha-card{background:#fcf7e8;border-radius:24px;box-shadow:inset 0 0 0 2px #fff9e8,inset 0 0 0 6px #d9c894,0 12px 28px rgba(0,0,0,.4);padding:6px 0 10px}
.cabecalho-skeuo{padding:8px 16px;border-bottom:2px solid #b28b5e;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;background:linear-gradient(to bottom,#fdf5e0,#f4e5ca);border-radius:20px 20px 12px 12px;margin-bottom:8px;gap:8px}
.title-area{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-family:Georgia;font-size:1.2rem;margin:0;color:#3b2a1f;text-shadow:2px 2px 0 #cdb086;display:flex;align-items:center;gap:10px}
.nav-mes{display:flex;align-items:center;gap:8px}
.mes-editavel{background:#f9f2e0;border:2px solid #c9aa77;border-radius:60px;padding:4px 12px;font-family:monospace;font-size:.85rem;font-weight:bold;width:110px;text-align:center}
.mes-editavel:disabled{background:#e9e0cf;opacity:.8}
.badge-senha{background:#b97f4b;border-radius:60px;padding:4px 12px;font-size:.7rem;font-weight:bold;color:#fff1cf;box-shadow:inset 0 1px 2px #ffdd99,0 3px 6px rgba(0,0,0,.2)}
.badge-senha.admin-mode{background:#2e7d32;color:#fff}
.top-actions{padding:0 10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.button-group{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn-skeuo{background:radial-gradient(circle at 30% 20%,#f3de9f,#cb9e6b);border:none;font-size:.75rem;font-weight:bold;padding:7px 14px;border-radius:60px;box-shadow:0 4px 0 #7a4f2c;cursor:pointer;transition:.05s linear;touch-action:manipulation}
.btn-skeuo:active{transform:translateY(3px);box-shadow:0 1px 0 #7a4f2c}
.btn-skeuo:disabled{opacity:.45;cursor:default;transform:none}
.btn-skeuo.rank-btn{background:radial-gradient(circle at 30% 20%,#9fcbef,#6b8fcb);box-shadow:0 4px 0 #2f4f7a}
.btn-skeuo.sair-btn{background:radial-gradient(circle at 30% 20%,#f3a49f,#cb6b6b);box-shadow:0 4px 0 #7a2f2f;display:none}
.btn-skeuo.preencher-btn{background:radial-gradient(circle at 30% 20%,#a5d6a5,#6f9e6f);box-shadow:0 4px 0 #2e6b2e;display:none}
.info-bar{display:flex;justify-content:flex-end;align-items:center;padding:0 12px 6px;gap:8px}
.sync-status{font-size:.65rem;background:#4c351e;padding:3px 10px;border-radius:60px;color:#ffe1a0}
.sync-status.rt-on{background:#1b5e20}
.btn-ajuda{background:#7a5230;color:#ffe1a0;border:none;width:28px;height:28px;border-radius:50%;font-size:.85rem;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.dias-botoes{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:0 8px 8px;padding:8px;background:#ddcdac;border-radius:28px;box-shadow:inset 0 0 0 2px #fef1cf,inset 0 0 0 4px #c2a570}
.btn-dia{background:radial-gradient(circle at 30% 20%,#f0dc9f,#c29a5e);border:none;font-size:.7rem;font-weight:bold;padding:7px 0;border-radius:50px;box-shadow:0 3px 0 #6b4828;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.1;width:100%;min-width:0;touch-action:manipulation;user-select:none}
.btn-dia .dia-num{font-size:.72rem;font-weight:bold}
.btn-dia .dia-total{font-size:.5rem;color:#5a3a10;white-space:nowrap}
.btn-dia.tem-dados .dia-total{color:#a05000;font-weight:bold}
.btn-dia.dia-selecionado{background:radial-gradient(circle at 30% 20%,#ffe066,#e6a800);box-shadow:0 3px 0 #7a5200,0 0 8px 2px rgba(230,167,0,.5)}
.btn-dia.dia-editando{background:radial-gradient(circle at 30% 20%,#a5d6a5,#6f9e6f);box-shadow:0 3px 0 #3e6b3e}
.table-wrapper{overflow-x:auto;margin:0 8px;background:#ddcdac;padding:6px;border-radius:18px;max-height:55vh;-webkit-overflow-scrolling:touch}
.planilha{width:100%;border-collapse:collapse;background:#fff6e8;min-width:900px;table-layout:fixed}
.planilha th,.planilha td{border:1px solid #ebddbb;padding:6px 3px;text-align:center;width:62px;min-width:62px}
.planilha th{background:linear-gradient(to bottom,#b88954,#7e5937);color:#fff4e0;position:sticky;top:0;z-index:10;font-size:.75rem}
.planilha td:first-child{background:#f7efdc;font-weight:bold;text-align:left;position:sticky;left:0;z-index:5;border-right:2px solid #dbb87a;font-size:.8rem;padding-left:6px;width:110px;min-width:110px}
.planilha th:first-child{position:sticky;left:0;z-index:15;background:#9c7a50;width:110px;min-width:110px}
.planilha th.col-ativa{background:linear-gradient(to bottom,#e6a800,#a07000)!important}
.planilha td.col-ativa{background:#fffacc!important}
.input-hora{width:58px;padding:4px;text-align:center;font-family:monospace;font-size:.78rem;background:#f9f2e0;border:2px solid #c9aa77;border-radius:12px;transition:all .15s;touch-action:manipulation}
.input-hora.has-value{background:#fff1b5;border-color:#e4b149;box-shadow:0 0 5px gold}
.input-hora.is-zero{background:#e0e0e0!important;border-color:#999!important;color:#555;font-weight:bold}
.input-hora.sugestao{background:#d4edda!important;border-color:#6c9e6c!important;box-shadow:0 0 6px #6c9e6c}
.input-hora.streak-day{background:#ffb366;border-color:#e67300;box-shadow:0 0 8px #e67300}
.input-hora:disabled,.input-hora[readonly]{background:#f0ebe0;cursor:not-allowed;opacity:.85}
.input-hora:focus:not(:disabled){outline:2px solid #ffaa00;box-shadow:0 0 0 4px rgba(255,170,0,.3);background:#fff8e0!important}
.input-hora.saving{background:#ffd699!important;border-color:#ff9900!important;animation:pulse .6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.total-cell{background:#e7dbbc;font-weight:bold;font-size:.8rem}
.group-title-row td{background:linear-gradient(135deg,#ccaa7a,#b1834d);font-weight:bold;font-size:1rem;text-align:center;padding:6px}
.info-footer{display:flex;justify-content:flex-end;align-items:center;margin:6px 12px 0;gap:8px}
.status-chip{background:#4c351e;border-radius:60px;padding:4px 12px;font-size:.65rem;font-weight:bold;color:#ffe1a0;box-shadow:inset 0 1px 3px #ffdf9a,0 2px 4px black}
.modal-senha,.modal-detalhe,.modal-ajuda{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:2000}
.card-senha,.card-detalhe,.card-ajuda{background:#fdf5e6;border-radius:32px;width:92%;max-width:500px;padding:20px;box-shadow:0 20px 35px black;max-height:88vh;overflow-y:auto}
.card-senha{text-align:center;max-width:320px}
.card-senha input{width:100%;padding:10px;margin:16px 0;border-radius:60px;border:2px solid #b67e45;background:#fff2e0;font-size:1rem;text-align:center}
.botoes-senha{display:flex;gap:12px;justify-content:center}
.btn-modal{background:#a07143;color:white;border:none;padding:8px 20px;border-radius:60px;cursor:pointer;font-size:.9rem}
.btn-fechar{background:#b07842;border:none;padding:10px 28px;border-radius:60px;color:white;margin-top:16px;cursor:pointer;display:block;margin-left:auto;margin-right:auto}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#3b2a1f;color:#ffe1a0;padding:8px 20px;border-radius:60px;font-size:.8rem;font-weight:bold;box-shadow:0 4px 12px rgba(0,0,0,.4);z-index:9999;opacity:0;transition:opacity .3s ease;pointer-events:none;white-space:nowrap;max-width:90vw}
.toast.show{opacity:1}
.folga-badge{font-size:.65rem;margin-left:4px;font-weight:bold}
.folga-badge.normal{color:#3b2a1f}
.folga-badge.igual8{color:#e6a800;font-weight:bold}
.folga-badge.acima8{color:#cc0000;font-weight:bold}
.progress-bar-wrap{background:#e0cfa8;border-radius:10px;height:12px;width:100%;overflow:hidden}
.barra-fill{background:#e67e22;height:100%;border-radius:10px;width:0%;transition:width .3s ease}
.color-bar{display:none;gap:6px;padding:6px 10px;margin:0 8px 8px;background:#ddcdac;border-radius:20px;justify-content:center;flex-wrap:wrap}
.color-bar.show{display:flex}
.btn-cor{width:28px;height:28px;border-radius:50%;border:2px solid #7a4f2c;cursor:pointer;box-shadow:0 2px 0 #5a3a1a}
.btn-cor:active{transform:translateY(2px);box-shadow:none}
.btn-cor.limpar{background:#f0ebe0;font-size:.7rem;display:flex;align-items:center;justify-content:center;color:#7a4f2c;font-weight:bold}
@media (max-width:600px){
.cabecalho-skeuo{flex-direction:column;align-items:stretch}
.title-area{justify-content:center}
.top-actions{flex-direction:column;align-items:stretch}
.button-group{justify-content:center}
.btn-skeuo{font-size:.7rem;padding:6px 10px}
.input-hora{width:44px;font-size:.7rem}
.planilha th,.planilha td{width:50px;min-width:50px;padding:4px 2px}
.planilha th:first-child,.planilha td:first-child{width:90px;min-width:90px}
}
</style>
</head>
<body>
<div class="skeuo-container">
<div class="planilha-card">
<div class="cabecalho-skeuo">
<div class="title-area">
<h1><i class="fas fa-plane-up"></i> REGISTRO DE HORAS</h1>
<div class="nav-mes">
<button class="btn-skeuo" id="btnMesAnterior">◀</button>
<input type="text" id="campoMes" class="mes-editavel" value="Agosto" disabled>
<button class="btn-skeuo" id="btnMesProximo">▶</button>
</div>
</div>
<div style="display:flex;gap:8px;align-items:center">
<span class="badge-senha" id="statusBadge">🔒 LEITURA</span>
</div>
</div>
<div class="top-actions">
<div class="button-group">
<button class="btn-skeuo" id="btnDesbloquear">🔐 DESBLOQUEAR</button>
<button class="btn-skeuo" id="btnBloquear" disabled>🔒 BLOQUEAR</button>
<button class="btn-skeuo sair-btn" id="btnSairDia" style="display:none">✖ SAIR</button>
<button class="btn-skeuo preencher-btn" id="btnPreencherVazios" style="display:none">🎨 PREENCHER VAZIOS</button>
<button class="btn-skeuo rank-btn" id="btnRanking">📊 RANKING</button>
</div>
<div class="info-bar" style="padding:0">
<span class="sync-status" id="syncStatus">💾 Carregando...</span>
<button class="btn-ajuda" id="btnAjuda">?</button>
</div>
</div>
<div class="color-bar" id="colorBar">
<button class="btn-cor limpar" data-cor="" title="Remover cor">✕</button>
<button class="btn-cor" data-cor="#ff6b6b" style="background:#ff6b6b"></button>
<button class="btn-cor" data-cor="#4ecdc4" style="background:#4ecdc4"></button>
<button class="btn-cor" data-cor="#45b7d1" style="background:#45b7d1"></button>
<button class="btn-cor" data-cor="#96ceb4" style="background:#96ceb4"></button>
<button class="btn-cor" data-cor="#ffeaa7" style="background:#ffeaa7"></button>
<button class="btn-cor" data-cor="#dfe6e9" style="background:#dfe6e9"></button>
<button class="btn-cor" data-cor="#a29bfe" style="background:#a29bfe"></button>
<button class="btn-cor" data-cor="#fd79a8" style="background:#fd79a8"></button>
</div>
<div class="dias-botoes" id="botoesDias"></div>
<div class="table-wrapper">
<table class="planilha" id="tabelaHoras">
<thead id="tableHeader"></thead>
<tbody id="planilhaBody"></tbody>
<tfoot id="tfootTotal"></tfoot>
</table>
</div>
<div class="info-footer">
<div class="status-chip" id="editModeChip">📖 VISUALIZAÇÃO</div>
</div>
</div>
</div>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
function showToast(msg,duracao=2000){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t)}t.textContent=msg;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),duracao)}
function parseHora(v){if(v===''||v===null||v===undefined)return null;let limpo=String(v).trim().replace(/[hH]/g,'').replace(',','.').replace(/[^0-9.]/g,'');let n=parseFloat(limpo);return isNaN(n)?null:n}
function formatarHora(n){if(n===null||isNaN(n))return '';return n.toFixed(1).replace('.',',')}
const MES_STORAGE_KEY='planilha_mes_ano';
function salvarMesAno(mes,ano){localStorage.setItem(MES_STORAGE_KEY,JSON.stringify({mes,ano}))}
function obterMesAno(){const d=localStorage.getItem(MES_STORAGE_KEY);return d?JSON.parse(d):null}
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
function getMesNumero(n){const m={janeiro:1,fevereiro:2,março:3,abril:4,maio:5,junho:6,julho:7,agosto:8,setembro:9,outubro:10,novembro:11,dezembro:12};return m[n.toLowerCase()]||new Date().getMonth()+1}
function getNomeMes(n){return MESES[n-1]||"Julho"}
let DIAS=31,anoAtual=new Date().getFullYear(),isEditing=false,password="",diaEditandoIndex=null,isSaving=false,saveRetries=0;
const MAX_RETRIES=3;
function diasNoMes(m,a){return new Date(a,m,0).getDate()}
function atualizarDias(){const mes=document.getElementById('campoMes').value.trim()||"Julho";DIAS=diasNoMes(getMesNumero(mes),anoAtual);return DIAS}
const GRUPOS_PILOTO={CARAVAN:["Cleiton","Joao","Pascoal","Lindomar","Perisson","Rui","Yago"],COPILOTO:["Cauê","Ruben","Ernesto","Daniela","Thales","Serafim","Ronalldo","Rodrigo"]};
function getGrupo(n){if(GRUPOS_PILOTO.CARAVAN.includes(n))return"CARAVAN";if(GRUPOS_PILOTO.COPILOTO.includes(n))return"COPILOTO";return"CESSNA 206/210"}
let LOGS={},SUGESTOES_GLOBAIS={},CORES_GLOBAIS={};
function getNomeFromRow(row){if(row.dataset&&row.dataset.pilot)return row.dataset.pilot;const c=row.cells[0];const n=c?.childNodes[0];if(n&&n.nodeType===Node.TEXT_NODE)return n.textContent.trim();return c?.innerText.trim()||""}
function obterChaveSugestao(inp){return `\( {document.getElementById('campoMes').value.trim()||"Julho"}_ \){anoAtual}_\( {inp.dataset.pilot}_ \){inp.dataset.dia}`}
function atualizarCorInput(inp,sugestoes){const v=parseHora(inp.value);inp.classList.remove('has-value','is-zero','sugestao');if(inp.dataset.cor){inp.style.backgroundColor=inp.dataset.cor;return}if(v===null){const k=obterChaveSugestao(inp);if(sugestoes&&sugestoes[k]){inp.classList.add('sugestao');inp.style.backgroundColor='#d4edda'}else inp.style.backgroundColor=''}else if(v===0){inp.classList.add('is-zero');inp.style.backgroundColor='#e0e0e0'}else if(v>0){inp.classList.add('has-value');inp.style.backgroundColor='#fff1b5'}}
function atualizarTotalLinha(row){let s=0;row.querySelectorAll('.input-hora').forEach(i=>{const v=parseHora(i.value);if(v!==null&&v>0)s+=v});const tc=row.querySelector('.total-cell');if(tc)tc.textContent=formatarHora(s);return s}
function validarStreaks(){document.querySelectorAll('#tabelaHoras tbody tr.membro-row').forEach(row=>{const inputs=[...row.querySelectorAll('.input-hora')];const vals=inputs.map(i=>parseHora(i.value)!==null);const seq=new Array(DIAS).fill(false);let streak=0,i=0;while(i<DIAS){if(vals[i]){streak++;if(streak===6){for(let j=i-5;j<=i;j++)seq[j]=true;if(i+1<DIAS)seq[i+1]=true;streak=0;i=i+2;continue}}else streak=0;i++}inputs.forEach((inp,idx)=>{if(seq[idx]&&!inp.dataset.cor){inp.classList.add('streak-day');inp.style.backgroundColor='#ffb366'}else inp.classList.remove('streak-day')})})}
function getLimiteDiasContagem(){const h=new Date(),mr=h.getMonth()+1,ar=h.getFullYear(),me=getMesNumero(document.getElementById('campoMes').value.trim()||"Julho");if(anoAtual===ar&&me===mr)return h.getDate();if(anoAtual<ar||(anoAtual===ar&&me<mr))return DIAS;return 0}
function contarFolgas(n,row){const lim=getLimiteDiasContagem();let c=0;for(let i=0;i<lim;i++){const inp=row.cells[i+1]?.querySelector('.input-hora');if(inp&&parseHora(inp.value)===null)c++}return c}
function atualizarTodosContadores(){document.querySelectorAll('#tabelaHoras tbody tr.membro-row').forEach(row=>{const n=getNomeFromRow(row),c=contarFolgas(n,row),td=row.cells[0];let b=td.querySelector('.folga-badge');if(!b){b=document.createElement('span');b.className='folga-badge';td.appendChild(b)}b.textContent=String(c).split('').map(d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[+d]).join('');b.className='folga-badge '+(c<8?'normal':c===8?'igual8':'acima8')})}
function recalcularTudo(){let s=0;document.querySelectorAll('#tabelaHoras tbody tr.membro-row').forEach(r=>s+=atualizarTotalLinha(r));const tf=document.getElementById('tfootTotal');tf.innerHTML='';const tr=document.createElement('tr');tr.innerHTML=`<td style="font-weight:bold">🏁 TOTAL GERAL</td>\( {'<td></td>'.repeat(DIAS)}<td class="total-geral"> \){formatarHora(s)}</td>`;tf.appendChild(tr);validarStreaks();atualizarTotaisBotoesDias();atualizarTodosContadores()}
function totalHorasDia(i){let s=0;document.querySelectorAll('#tabelaHoras tbody tr.membro-row').forEach(r=>{const inp=r.cells[i+1]?.querySelector('.input-hora');if(inp){const v=parseHora(inp.value);if(v!==null&&v>0)s+=v}});return s}
function atualizarTotaisBotoesDias(){document.querySelectorAll('.btn-dia').forEach((b,i)=>{const t=totalHorasDia(i);const el=b.querySelector('.dia-total');if(el)el.textContent=t>0?formatarHora(t)+'h':'';b.classList.toggle('tem-dados',t>0)})}
function aplicarCor(cor){if(diaEditandoIndex===null)return;const f=document.activeElement;if(f&&f.classList.contains('input-hora')&&!f.disabled){if(cor){f.dataset.cor=cor;f.style.backgroundColor=cor}else{delete f.dataset.cor;atualizarCorInput(f,SUGESTOES_GLOBAIS)}}else{document.querySelectorAll('#tabelaHoras tbody tr.membro-row').forEach(r=>{const inp=r.cells[diaEditandoIndex+1]?.querySelector('.input-hora');if(!inp)return;if(parseHora(inp.value)===null){if(cor){inp.dataset.cor=cor;inp.style.backgroundColor=cor}else{delete inp.dataset.cor;atualizarCorInput(inp,SUGESTOES_GLOBAIS)}}})}salvarNoBackend();showToast(cor?'🎨 Cor aplicada':'🗑️ Cor removida')}
function ativarEdicaoDia(i){if(!isEditing){showToast("⚠️ Desbloqueie a planilha primeiro.");return}sairEdicaoDia();diaEditandoIndex=i;document.querySelectorAll('#tabelaHoras tbody .input-hora').forEach(inp=>inp.disabled=true);document.querySelectorAll('#tabelaHoras tbody tr.membro-row').forEach(r=>{const inp=r.cells[i+1]?.querySelector('.input-hora');if(inp)inp.disabled=false});document.querySelectorAll('.col-ativa').forEach(e=>e.classList.remove('col-ativa'));document.querySelectorAll('#tableHeader th')[i+1]?.classList.add('col-ativa');document.querySelectorAll('#tabelaHoras tbody tr').forEach(r=>{if(r.cells[i+1])r.cells[i+1].classList.add('col-ativa')});document.querySelectorAll('.btn-dia').forEach((b,idx)=>b.classList.toggle('dia-editando',idx===i));document.getElementById('btnSairDia').style.display='inline-block';document.getElementById('btnPreencherVazios').style.display='inline-block';document.getElementById('colorBar').classList.add('show');showToast(`✏️ Editando dia ${String(i+1).padStart(2,'0')}`)}
function sairEdicaoDia(){if(diaEditandoIndex!==null){document.querySelectorAll('#tabelaHoras tbody .input-hora').forEach(i=>i.disabled=true);document.querySelectorAll('.col-ativa').forEach(e=>e.classList.remove('col-ativa'));document.querySelectorAll('.btn-dia').forEach(b=>b.classList.remove('dia-editando'));diaEditandoIndex=null;document.getElementById('btnSairDia').style.display='none';document.getElementById('btnPreencherVazios').style.display='none';document.getElementById('colorBar').classList.remove('show');showToast('🔓 Edição geral restaurada')}}
function preencherVazios(){if(diaEditandoIndex===null)return showToast('⚠️ Selecione um dia primeiro.');let c=0;document.querySelectorAll('#tabelaHoras tbody tr.membro-row').forEach(r=>{const inp=r.cells[diaEditandoIndex+1]?.querySelector('.input-hora');if(!inp)return;if(parseHora(inp.value)===null){inp.classList.add('sugestao');if(!inp.dataset.cor)inp.style.backgroundColor='#d4edda';SUGESTOES_GLOBAIS[obterChaveSugestao(inp)]=true;c++}});salvarNoBackend();showToast(`🎨 ${c} células vazias destacadas`)}
function setEditMode(e){isEditing=e;if(!e){sairEdicaoDia();document.querySelectorAll('#tabelaHoras tbody .input-hora').forEach(i=>i.disabled=true)}else document.querySelectorAll('#tabelaHoras tbody .input-hora').forEach(i=>i.disabled=true);document.getElementById('btnBloquear').disabled=!e;document.getElementById('btnDesbloquear').disabled=e;document.getElementById('campoMes').disabled=!e;document.getElementById('editModeChip').innerHTML=e?'✏️ EDIÇÃO ATIVA':'📖 VISUALIZAÇÃO';document.getElementById('statusBadge').innerHTML=e?'🔓 EDIÇÃO':'🔒 LEITURA';document.getElementById('statusBadge').classList.toggle('admin-mode',e);showToast(e?'✅ Modo edição ativado':'🔒 Modo leitura ativado')}
function exibirModalSenha(){return new Promise(r=>{const m=document.createElement('div');m.className='modal-senha';m.innerHTML=`<div class="card-senha"><h3>🔐 AUTENTICAÇÃO</h3><p>Digite a senha:</p><input type="password" id="senhaInput" placeholder="Senha" autocomplete="off"><div class="botoes-senha"><button class="btn-modal" id="confirmarSenha">Confirmar</button><button class="btn-modal" id="cancelarSenha">Cancelar</button></div></div>`;document.body.appendChild(m);const i=m.querySelector('#senhaInput');const ok=()=>{const s=i.value;m.remove();r(s)};const no=()=>{m.remove();r(null)};m.querySelector('#confirmarSenha').onclick=ok;m.querySelector('#cancelarSenha').onclick=no;i.focus();i.addEventListener('keypress',e=>{if(e.key==='Enter')ok()})})}
async function login(){if(isEditing)return;const s=await exibirModalSenha();if(s==="Emerson"||s==="Bispo"){password=s;setEditMode(true)}else if(s!==null)showToast("❌ Senha incorreta.")}
function bloquear(){if(!isEditing)return;setEditMode(false);password=""}
async function salvarNoBackend(){if(!isEditing||isSaving)return;isSaving=true;saveRetries=0;const sync=document.getElementById('syncStatus');sync.innerHTML='⏳ Salvando...';const tentar=async()=>{try{const mes=document.getElementById('campoMes').value.trim()||"Julho";const month=getMesNumero(mes);const logs={},cores={};document.querySelectorAll('#tabelaHoras tbody tr.membro-row').forEach(row=>{const nome=getNomeFromRow(row);logs[nome]={};row.querySelectorAll('.input-hora').forEach((inp,i)=>{const day=i+1;logs[nome][day]=parseHora(inp.value);if(inp.dataset.cor)cores[`\( {nome}_ \){day}`]=inp.dataset.cor})});const sugestoes={};document.querySelectorAll('#tabelaHoras tbody .input-hora.sugestao').forEach(inp=>{sugestoes[obterChaveSugestao(inp)]=true});SUGESTOES_GLOBAIS=sugestoes;CORES_GLOBAIS=cores;const resp=await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password,logs,month,year:anoAtual,sugestoes,cores}),signal:AbortSignal.timeout(15000)});const d=await resp.json();if(!resp.ok||!d.success)throw new Error(d.erro||`HTTP ${resp.status}`);sync.innerHTML='✅ Salvo';setTimeout(()=>sync.innerHTML='💾 Sincronizado',1500);showToast('✅ Dados salvos');isSaving=false}catch(e){console.error(e);saveRetries++;if(saveRetries<MAX_RETRIES){sync.innerHTML=`⏳ Retry \( {saveRetries}/ \){MAX_RETRIES}...`;setTimeout(tentar,2000)}else{sync.innerHTML='❌ Erro ao salvar';showToast(`❌ Falha após ${MAX_RETRIES} tentativas`,5000);isSaving=false}}};tentar()}
async function carregarDoBackend(){const sync=document.getElementById('syncStatus');sync.innerHTML='⏳ Carregando...';try{const mes=document.getElementById('campoMes').value.trim()||"Julho";const mesNum=getMesNumero(mes);const res=await fetch(`/api/data?month=\( {mesNum}&year= \){anoAtual}`,{signal:AbortSignal.timeout(8000)});if(!res.ok)throw new Error(`HTTP \( {res.status}`);const data=await res.json();if(!data.pilots||!data.logs)throw new Error('Resposta incompleta');LOGS=data.logs||{};SUGESTOES_GLOBAIS=data.sugestoes||{};CORES_GLOBAIS=data.cores||{};atualizarDias();const thead=document.getElementById('tableHeader');let h=`<tr><th>👤 PILOTO</th>`;for(let i=0;i<DIAS;i++){const d=new Date(anoAtual,mesNum-1,i+1);const ds=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][d.getDay()];h+=`<th> \){String(i+1).padStart(2,'0')} ${ds}</th>`}h+=`<th>⭐ TOTAL</th></tr>`;thead.innerHTML=h;const tbody=document.getElementById('planilhaBody');tbody.innerHTML='';const grupos={"CESSNA 206/210":[],"CARAVAN":[],"COPILOTO":[]};data.pilots.forEach(p=>{if(p.name==="TESTE_AUTO")return;const g=getGrupo(p.name);(grupos[g]||grupos["CESSNA 206/210"]).push(p)});for(let g in grupos)grupos[g].sort((a,b)=>a.name.localeCompare(b.name));for(let grupo of["CESSNA 206/210","CARAVAN","COPILOTO"]){const tr=document.createElement('tr');tr.classList.add('group-title-row');const td=document.createElement('td');td.colSpan=DIAS+2;const ic=document.createElement('i');ic.className=`fas ${grupo==="CARAVAN"?"fa-plane-departure":grupo==="COPILOTO"?"fa-user-pilot":"fa-plane-up"}`;ic.style.marginRight='8px';td.appendChild(ic);td.appendChild(document.createTextNode(` ${grupo}`));tr.appendChild(td);tbody.appendChild(tr);for(let p of grupos[grupo]){const row=document.createElement('tr');row.classList.add('membro-row');row.dataset.pilot=p.name;const nc=document.createElement('td');nc.textContent=p.name;row.appendChild(nc);for(let i=0;i<DIAS;i++){const td=document.createElement('td');const inp=document.createElement('input');inp.type='text';inp.inputMode='decimal';inp.classList.add('input-hora');inp.dataset.pilot=p.name;inp.dataset.dia=i+1;const vs=(LOGS[p.name]&&LOGS[p.name][i+1]!==undefined)?LOGS[p.name][i+1]:null;if(vs===0)inp.value='0';else if(vs!==null&&vs>0)inp.value=formatarHora(vs);else inp.value='';const cs=CORES_GLOBAIS[p.name]?.[i+1];if(cs){inp.dataset.cor=cs;inp.style.backgroundColor=cs}atualizarCorInput(inp,SUGESTOES_GLOBAIS);inp.disabled=true;inp.addEventListener('input',function(){if(!isEditing||diaEditandoIndex!==i)return;this.classList.remove('saving','sugestao');delete SUGESTOES_GLOBAIS[obterChaveSugestao(this)];atualizarTotalLinha(row);recalcularTudo()});inp.addEventListener('blur',function(){if(!isEditing||diaEditandoIndex!==i)return;let v=parseHora(this.value);if(v===null||v<0){v=null;this.value=''}else this.value=v===0?'0':formatarHora(v);atualizarCorInput(this,SUGESTOES_GLOBAIS);atualizarTotalLinha(row);recalcularTudo();this.classList.add('saving');salvarNoBackend();setTimeout(()=>this.classList.remove('saving'),1500)});inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&isEditing&&diaEditandoIndex===i){e.preventDefault();this.blur()}});td.appendChild(inp);row.appendChild(td)}const tc=document.createElement('td');tc.classList.add('total-cell');let tot=0;row.querySelectorAll('.input-hora').forEach(i=>{const v=parseHora(i.value);if(v!==null&&v>0)tot+=v});tc.textContent=formatarHora(tot);row.appendChild(tc);tbody.appendChild(row)}}recalcularTudo();criarBotoesDias();setEditMode(false);sync.innerHTML='✅ Carregado';setTimeout(()=>sync.innerHTML='💾 Sincronizado',2000);if(socket&&socket.connected)socket.emit('join_month',{month:mesNum,year:anoAtual})}catch(e){console.error(e);document.getElementById('syncStatus').innerHTML='❌ Erro';showToast(`❌ Erro ao carregar: ${e.message}`,4000)}}
function criarBotoesDias(){const c=document.getElementById('botoesDias');c.innerHTML='';for(let i=0;i<DIAS;i++){const b=document.createElement('button');b.classList.add('btn-dia');b.innerHTML=`<span class="dia-num">${String(i+1).padStart(2,'0')}</span><span class="dia-total"></span>`;b.onclick=()=>{document.querySelectorAll('.btn-dia').forEach(x=>x.classList.remove('dia-selecionado'));b.classList.add('dia-selecionado');if(isEditing)ativarEdicaoDia(i);else showToast('🔐 Desbloqueie para editar')};c.appendChild(b)}atualizarTotaisBotoesDias()}
function mostrarRanking(){const mes=document.getElementById('campoMes').value.trim()||"Julho";const ps=[];document.querySelectorAll('#tabelaHoras tbody tr.membro-row').forEach(r=>{const n=getNomeFromRow(r);let t=0;r.querySelectorAll('.input-hora').forEach(i=>{const v=parseHora(i.value);if(v!==null&&v>0)t+=v});ps.push({nome:n,total:t,grupo:getGrupo(n)})});const gs=["CESSNA 206/210","CARAVAN","COPILOTO"];const dg={};gs.forEach(g=>dg[g]=[]);ps.forEach(p=>(dg[p.grupo]||dg["CESSNA 206/210"]).push(p));for(let g in dg)dg[g].sort((a,b)=>b.total-a.total);let html=`<div class="card-detalhe"><h2 style="text-align:center">📊 Ranking — \( {mes}</h2>`;const tit={"CESSNA 206/210":'CMTES CESSNA 206/210',"CARAVAN":'CMTES CARAVAN 208',"COPILOTO":'COPILOTOS CARAVAN'};for(let g of gs){const l=dg[g]||[];if(!l.length)continue;const max=Math.max(...l.map(p=>p.total),0.1);html+=`<h3 style="margin-top:16px;color:#3b2a1f;border-bottom:2px solid #ccaa7a;padding-bottom:4px"> \){tit[g]}</h3><ul style="margin:4px 0 12px;padding:0;list-style:none">`;l.forEach(p=>{const perc=max>0?(p.total/max)*100:0;html+=`<li style="padding:6px 8px;border-bottom:1px solid #e8d5b0"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span><strong>\( {p.nome}</strong></span><strong style="color: \){p.total>0?'#2a8a2a':'#aaa'}">\( {p.total===0?'—':formatarHora(p.total)+'h'}</strong></div><div class="progress-bar-wrap"><div class="barra-fill" style="width: \){perc}%"></div></div></li>`});html+=`</ul>`}html+=`<button class="btn-fechar" id="fecharRanking">Fechar</button></div>`;const m=document.createElement('div');m.className='modal-detalhe';m.innerHTML=html;document.body.appendChild(m);m.querySelector('#fecharRanking').onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove()}}
function mostrarAjuda(){const itens=[{cor:'#fff1b5',t:'Amarelo → horas > 0'},{cor:'#e0e0e0',t:'Cinza → zero digitado'},{cor:'#d4edda',t:'Verde → sugestão'},{cor:'#ffb366',t:'Laranja → streak'},{cor:'#e7dbbc',t:'Total (ignora zeros)'}];let h=`<div class="card-ajuda"><h3 style="text-align:center">📖 Legenda</h3>`;itens.forEach(i=>h+=`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #e0cfa8;font-size:.85rem"><div style="width:36px;height:24px;border-radius:8px;background:\( {i.cor};border:1px solid #999"></div><span> \){i.t}</span></div>`);h+=`<hr><p style="font-size:.8rem;color:#7a5000;text-align:center">Desbloqueie → clique no dia → use a barra de cores.<br>Zeros só aparecem se você digitar 0.</p><button class="btn-fechar" id="fecharAjuda">Fechar</button></div>`;const m=document.createElement('div');m.className='modal-ajuda';m.innerHTML=h;document.body.appendChild(m);m.querySelector('#fecharAjuda').onclick=()=>m.remove()}
document.getElementById('btnMesAnterior').onclick=()=>{if(!isEditing)return showToast("⚠️ Desbloqueie");sairEdicaoDia();let m=getMesNumero(document.getElementById('campoMes').value.trim());if(--m<1){m=12;anoAtual--}document.getElementById('campoMes').value=getNomeMes(m);salvarMesAno(getNomeMes(m),anoAtual);carregarDoBackend()};
document.getElementById('btnMesProximo').onclick=()=>{if(!isEditing)return showToast("⚠️ Desbloqueie");sairEdicaoDia();let m=getMesNumero(document.getElementById('campoMes').value.trim());if(++m>12){m=1;anoAtual++}document.getElementById('campoMes').value=getNomeMes(m);salvarMesAno(getNomeMes(m),anoAtual);carregarDoBackend()};
document.getElementById('campoMes').onchange=function(){if(!isEditing)return showToast("⚠️ Desbloqueie");sairEdicaoDia();salvarMesAno(this.value.trim(),anoAtual);carregarDoBackend()};
document.getElementById('btnDesbloquear').onclick=login;
document.getElementById('btnBloquear').onclick=bloquear;
document.getElementById('btnSairDia').onclick=sairEdicaoDia;
document.getElementById('btnPreencherVazios').onclick=preencherVazios;
document.getElementById('btnRanking').onclick=mostrarRanking;
document.getElementById('btnAjuda').onclick=mostrarAjuda;
document.querySelectorAll('.btn-cor').forEach(b=>b.onclick=()=>aplicarCor(b.dataset.cor||null));
const st=obterMesAno(),da=new Date();if(st){document.getElementById('campoMes').value=st.mes;anoAtual=st.ano}else{document.getElementById('campoMes').value=getNomeMes(da.getMonth()+1);anoAtual=da.getFullYear()}
carregarDoBackend();
let socket=null;
function iniciarSocket(){if(typeof io==='undefined'||socket)return;socket=io({transports:['polling']});socket.on('connect',()=>{document.getElementById('syncStatus').classList.add('rt-on');const m=document.getElementById('campoMes').value.trim()||"Julho";socket.emit('join_month',{month:getMesNumero(m),year:anoAtual})});socket.on('disconnect',()=>document.getElementById('syncStatus').classList.remove('rt-on'));socket.on('connect_error',()=>document.getElementById('syncStatus').classList.remove('rt-on'))}
iniciarSocket();
</script>
</body>
</html>
